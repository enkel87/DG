# Bevakningsinställningar
notify_only_on_change: true
state_file: state.json
headless: true

notifier:
  email_enabled: true
  smtp_host: smtp.gmail.com
  smtp_port: 587
  # Adresser läses från miljövariabler (GitHub Secrets):
  #   SMTP_USER, EMAIL_TO, SMTP_PASSWORD
  smtp_password_env: SMTP_PASSWORD
  smtp_user_env: SMTP_USER
  email_to_env: EMAIL_TO

watches:
  - name: "Ny-Vy 20 augusti 20:15"
    trip_type: one_way
    origin: nynashamn
    destination: visby
    outbound_date: "2026-08-20"
    departure_time: "20:15"
    passengers:
      adults: 1
    vehicle: personbil
