name: Gotland statusrapport

on:
  schedule:
    # 05:00 UTC = 07:00 svensk sommartid (06:00 vintertid)
    - cron: "0 6 * * *"
  # Tryck "Run workflow" för att testa mejlkedjan när du vill
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Hämta koden
        uses: actions/checkout@v5

      - name: Sätt upp Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installera Python-paket
        run: pip install -r requirements.txt

      - name: Installera Chromium
        run: python -m playwright install --with-deps chromium

      - name: Skicka statusrapport
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python watch.py --config config.yaml --report-email
