name: Gotland watch

on:
  schedule:
    # Skyddsnät. Normalt startar varje körning nästa själv (sista steget),
    # men om en kedja bryts fångar detta upp den inom 6 timmar.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write     # för att spara state.json tillbaka till repot
  actions: write      # för att jobbet ska kunna starta nästa körning

concurrency:
  group: gotland-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # GitHub tillåter max 6 h per jobb. Lite marginal över max-runtime.
    timeout-minutes: 355

    steps:
      - name: Hämta koden
        uses: actions/checkout@v5

      - name: Sätt upp Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installera Python-paket
        run: pip install -r requirements.txt

      - name: Installera Chromium
        run: python -m playwright install --with-deps chromium

      - name: Bevaka i 5 h 50 min, kontroll varje minut
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python watch.py \
            --config config.yaml \
            --daemon \
            --max-runtime 21000

      - name: Spara state.json till repot
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Uppdatera state [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
            echo "state.json sparad"
          else
            echo "Ingen ändring i state.json"
          fi

      # Startar nästa körning direkt så att bevakningen är i princip
      # sammanhängande. Utan detta uppstår en död zon mellan jobben.
      - name: Starta nästa körning
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run watch.yml --ref "${GITHUB_REF_NAME}"
          echo "Nästa körning köad"        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python watch.py --config config.yaml

      - name: Spara state.json till repot
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Uppdatera state [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
            echo "state.json uppdaterad och sparad"
          else
            echo "Ingen ändring i state.json"
          fi
